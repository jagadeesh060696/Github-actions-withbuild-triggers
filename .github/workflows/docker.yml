name: Docker Build and Push

# ------------------ Triggers ------------------
on:
  push:
    branches:
      - main                # triggers on main branch push
    paths:
      - 'github-actions-docker/**'  # only runs if app code changes
  pull_request:
    branches:
      - main                # triggers on PR to main branch
  workflow_dispatch:        # allows manual trigger
  schedule:
    - cron: '0 3 * * *'     # nightly build at 3 AM UTC

# ------------------ Jobs ------------------
jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Set Docker image tags
      - name: Set IMAGE_TAG
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_LATEST=latest" >> $GITHUB_ENV

      # 3️⃣ Docker login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build Docker image (multi-tag)
      - name: Build Docker Image
        run: |
          docker build \
            --file ./github-actions-docker/Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ env.IMAGE_TAG }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ env.IMAGE_LATEST }} \
            ./github-actions-docker

      # 5️⃣ Push Docker images
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ env.IMAGE_LATEST }}
